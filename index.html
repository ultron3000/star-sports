<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Cloud TV</title>

<link rel="icon" href="https://static.readdy.ai/image/0ece273271e400e488b9947cb1e99e9a/a79b6f32c71c4ee2094ead0eb9c84c9b.png">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700&display=swap" rel="stylesheet">

<style>
:root {
  --bg:#050509;
  --card:#0b0b12;
  --border:rgba(255,255,255,.08);
  --radius:18px;
}
*{box-sizing:border-box;}
body{margin:0;font-family:Inter,sans-serif;background:var(--bg);color:#fff;}

header{
  position:sticky;top:0;z-index:20;
  display:flex;align-items:center;gap:12px;
  padding:14px 16px;background:#07070c;border-bottom:1px solid var(--border);
}
header img{height:38px;}
header span{font-size:20px;font-weight:700;}
#searchBar{
  margin-left:auto;padding:7px 12px;border-radius:20px;border:none;
  outline:none;font-size:14px;background:#222;color:white;
}
#searchBar:focus{background:#333;box-shadow:0 0 8px #00ffcc;}

#categories{text-align:center;margin:12px 0;}
#categories button{
  background:linear-gradient(145deg,#ffeb3b,#fdd835);
  border:none;padding:8px 18px;margin:6px;font-weight:600;
  border-radius:20px;cursor:pointer;
}
#categories button.active{background:#00ffcc;color:#000;}

.grid{display:grid;gap:14px;}
@media(max-width:600px){.grid{grid-template-columns:repeat(2,1fr)}}
@media(min-width:601px){.grid{grid-template-columns:repeat(auto-fill,minmax(180px,1fr))}}

.card{
  background:var(--card);border-radius:var(--radius);
  overflow:hidden;border:1px solid var(--border);
  cursor:pointer;transition:0.2s;
}
.card:hover{transform:scale(1.05);}
.card img{width:100%;height:120px;object-fit:contain;background:#000;}
.card h3{text-align:center;padding:8px;font-size:14px;font-weight:600;}

#playerModal{
  display:none;
  position:fixed;inset:0;background:rgba(0,0,0,0.95);
  z-index:9999;display:flex;flex-direction:column;
  justify-content:center;align-items:center;
}

#controls{
  display:flex;gap:10px;margin-top:8px;
  background:#111;padding:8px 10px;border-radius:12px;
}

.btn{
  background:#111;color:#fff;border:1px solid var(--border);
  padding:8px 12px;border-radius:10px;cursor:pointer;
}
.btn:hover{background:#00ffcc;color:#000;}

#closeBtn{
  position:absolute;top:10px;right:10px;
  background:#000;color:#fff;border:none;font-size:22px;
  cursor:pointer;
}
</style>
</head>

<body>

<header>
<a href="https://ultron3000.github.io/ultron" style="display:flex;align-items:center;gap:8px;text-decoration:none;color:inherit;">
<img src="https://static.readdy.ai/image/0ece273271e400e488b9947cb1e99e9a/a79b6f32c71c4ee2094ead0eb9c84c9b.png">
<span>Cloud TV</span>
</a>
<input type="text" id="searchBar" placeholder="Search channels...">
</header>

<div id="categories"></div>
<div id="channels" class="grid"></div>

<div id="playerModal">
<button id="closeBtn" onclick="closePlayer()">✖</button>

<video id="player" controls style="width:90%;max-width:1100px;height:70vh;background:black;border-radius:12px;"></video>

<div id="controls">
<button id="prevBtn" class="btn">Prev</button>
<button id="playPauseBtn" class="btn">Play</button>
<button id="nextBtn" class="btn">Next</button>
<button id="fullscreenBtn" class="btn">Fullscreen</button>
<button id="muteBtn" class="btn">Mute</button>
<button id="closeCtrlBtn" class="btn">Close</button>
</div>
</div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/shaka-player/4.3.6/shaka-player.compiled.js"></script>

<script>
let channels=[],filtered=[],currentGroup="All",currentIndex=0,player;

const video = document.getElementById("player");
// Ensure no src and paused on load
video.src = "";
video.pause();

async function loadChannels(){
  const res=await fetch("https://raw.githubusercontent.com/sixpg/jio/main/stream.json");
  const data=await res.json();

  channels=Object.values(data).map(c=>({
    name:c.channel_name,
    logo:c.tvg_logo,
    link:c.url,
    group:c.group_title,
    kid:c.kid,
    key:c.key
  }));

  filtered=channels;
  renderCategories();
  renderChannels();
}

function renderCategories(){
  const groups=["All",...new Set(channels.map(c=>c.group))];
  const container=document.getElementById("categories");
  container.innerHTML="";
  groups.forEach(g=>{
    const btn=document.createElement("button");
    btn.textContent=g;
    if(g===currentGroup) btn.classList.add("active");
    btn.onclick=()=>{currentGroup=g;filterChannels();};
    container.appendChild(btn);
  });
}

function filterChannels(){
  const s=document.getElementById("searchBar").value.toLowerCase();
  filtered=channels.filter(c=>(currentGroup==="All"||c.group===currentGroup)&&c.name.toLowerCase().includes(s));
  renderChannels();
}

function renderChannels(){
  const grid=document.getElementById("channels");
  grid.innerHTML="";
  filtered.forEach((ch,i)=>{
    const card=document.createElement("div");
    card.className="card";
    card.innerHTML=`<img src="${ch.logo}"><h3>${ch.name}</h3>`;
    card.onclick=()=>openPlayer(i);
    grid.appendChild(card);
  });
}

async function openPlayer(index){
  currentIndex = index;
  document.getElementById("playerModal").style.display = "flex";

  // Destroy previous player if exists
  if(player) await player.destroy();

  player = new shaka.Player(video);

  const ch = filtered[index];

  try {
    await player.configure({
      drm: { clearKeys: { [ch.kid]: ch.key } }
    });
    await player.load(ch.link);
    video.play(); // autoplay on click only
  } catch(e) {
    alert("Stream failed");
    console.error(e);
  }
}

function closePlayer(){
  video.pause();
  video.src = "";
  if(player) player.destroy();
  document.getElementById("playerModal").style.display = "none";
}

document.getElementById("playPauseBtn").onclick = () => video.paused ? video.play() : video.pause();
document.getElementById("muteBtn").onclick = () => video.muted = !video.muted;
document.getElementById("fullscreenBtn").onclick = () => video.requestFullscreen && video.requestFullscreen();
document.getElementById("prevBtn").onclick = () => currentIndex>0 && openPlayer(currentIndex-1);
document.getElementById("nextBtn").onclick = () => currentIndex<filtered.length-1 && openPlayer(currentIndex+1);
document.getElementById("closeCtrlBtn").onclick = closePlayer;
document.getElementById("searchBar").addEventListener("input", filterChannels);

loadChannels();
</script>

</body>
</html>
